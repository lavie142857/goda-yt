name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package app (portable)
        run: npx electron-builder --win portable --publish never
        env:
          NODE_ENV: production

      - name: Create Release and Upload
        shell: bash
        run: |
          TAG="release-$(date +%s)"
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" "release/FLASH-MEDIA-Portable-win64.zip" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
