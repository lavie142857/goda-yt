name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          NODE_ENV: production

      - name: Clean release directory
        run: rm -Force -Recurse -Path ./release -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Package app (NSIS Installer)
        run: pwsh ./scripts/build-windows.ps1
        shell: pwsh
        env:
          NODE_ENV: production

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLASH-MEDIA-Setup
          path: release/*.exe
          retention-days: 30
